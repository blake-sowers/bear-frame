name: Daily bear map

on:
  schedule:
    - cron: "17 10 * * *"   # every day ~4:17 am Central
  workflow_dispatch:        # adds a "Run workflow" button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python bear_report.py
      - name: Save the new image
        run: |
          git config user.name "bear-bot"
          git config user.email "bear-bot@users.noreply.github.com"
          git add -f out/frame.png
          git commit -m "Daily bear map $(date +%F)" || echo "No change"
          git push
